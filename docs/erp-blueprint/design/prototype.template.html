<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="YummyAI 自营经营与工厂协同 ERP 设计样稿 使用虚构数据 无外部业务操作">
  <title>YummyAI ERP 设计样稿</title>
  <style>/*__PROTOTYPE_CSS__*/</style>
</head>
<body>
  <a class="skip-link" href="#main">跳到工作区</a>
  <button class="nav-shade" id="nav-shade" aria-label="关闭导航"></button>
  <aside class="sidebar" id="sidebar" aria-label="工作台导航">
    <a class="brand" href="#orders"><span class="brand-mark">Y</span><span>YummyAI<small>定制经营与工厂协同</small></span></a>
    <div class="workspace-name">{{icon:Building2}}<span>自营工作台</span><span class="small-tag">设计</span></div>
    <div class="nav-caption">日常工作</div>
    <nav id="navigation">
      <button class="nav-item active" data-view="orders">{{icon:ClipboardList}}<span>订单与制作</span><span class="nav-count">4</span></button>
      <button class="nav-item" data-view="products">{{icon:Layers}}<span>商品方案</span></button>
      <button class="nav-item" data-view="factories">{{icon:Factory}}<span>工厂协同</span><span class="nav-dot"></span></button>
      <button class="nav-item" data-view="costs">{{icon:ChartNoAxesCombined}}<span>合格交付成本</span></button>
      <div class="nav-caption">建设与评审</div>
      <button class="nav-item" data-view="roadmap">{{icon:Route}}<span>建设阶段</span></button>
      <a class="nav-item" href="overview.html">{{icon:BookOpen}}<span>完整蓝图总览</span>{{icon:ArrowUpRight}}</a>
    </nav>
    <div class="sidebar-footer"><strong>演示环境</strong><span>虚构订单与工厂</span><span>不连接店铺和生产系统</span><a href="THIRD_PARTY_NOTICES.md">Lucide 开源图标</a></div>
  </aside>
  <div class="shell">
    <header class="topbar">
      <button class="icon-button mobile-menu" id="menu-toggle" aria-label="打开导航" aria-expanded="false">{{icon:Menu}}</button>
      <div class="breadcrumb">自营工作台 <span>/</span> <strong id="breadcrumb-current">订单与制作</strong></div>
      <div class="topbar-actions"><span class="prototype-badge">可点击设计样稿</span><button class="quiet-button" id="reset-demo">{{icon:RotateCcw}}<span>重置演示</span></button></div>
    </header>
    <main id="main" tabindex="-1" aria-busy="false"></main>
    <footer class="page-footer">方案版本 1.0 · 2026-10-15 <span>本样稿只演示交互 不证明真实接口、权限或生产能力</span></footer>
  </div>
  <dialog id="action-dialog" aria-labelledby="dialog-heading"><div class="dialog-shell"><div class="dialog-head"><h2 id="dialog-heading"></h2><button class="icon-button" data-action="close-dialog" aria-label="关闭对话框">{{icon:X}}</button></div><div id="dialog-body"></div></div></dialog>
  <dialog id="detail-dialog" aria-labelledby="mobile-detail-heading"><div class="dialog-shell"><div class="dialog-head"><h2 id="mobile-detail-heading">订单商品详情</h2><button class="icon-button" data-action="close-detail" aria-label="关闭商品详情">{{icon:X}}</button></div><div id="mobile-detail-body"></div></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>/*__PROTOTYPE_JS__*/</script>
</body>
</html>

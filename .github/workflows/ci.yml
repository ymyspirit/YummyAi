name: YummyAI release gates

on:
  workflow_dispatch:
    inputs:
      gate:
        description: Checks to run
        type: choice
        options: [all, windows]
        default: all
  pull_request:
  push:
    # Branch updates are checked by pull_request.synchronize. Checking them
    # again on push creates duplicate runs that cancel one another.
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ inputs.gate || 'all' }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || inputs.gate == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      POSTGRES_DB: yummyai
      POSTGRES_USER: yummyai_local
      POSTGRES_PASSWORD: yummyai_ci_postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql://yummyai_local:yummyai_ci_postgres@localhost:5432/yummyai
      REDIS_PASSWORD: yummyai_ci_redis
      REDIS_PORT: 6379
      REDIS_URL: redis://:yummyai_ci_redis@localhost:6379
      MINIO_ROOT_USER: yummyai_ci_admin
      MINIO_ROOT_PASSWORD: yummyai_ci_minio_password
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: yummyai_ci_admin
      S3_SECRET_ACCESS_KEY: yummyai_ci_minio_password
      S3_PRIVATE_BUCKET: yummyai-private
      KEYCLOAK_ADMIN: yummyai_ci_admin
      KEYCLOAK_ADMIN_PASSWORD: yummyai_ci_keycloak
      OIDC_ISSUER: http://localhost:8081/realms/yummyai
      OIDC_AUDIENCE: yummyai-api
      OIDC_WEB_CLIENT_ID: yummyai-web
      OIDC_WEB_REDIRECT_URI: http://localhost:3000/auth/callback
      LOCAL_OIDC_CLIENT_ID: yummyai-local-web
      LOCAL_OIDC_CLIENT_SECRET: yummyai_ci_local_oidc_secret
      LOCAL_EXTENSION_USER: yummyai-local
      LOCAL_EXTENSION_USER_EMAIL: yummyai-extension@yummyai.local
      LOCAL_EXTENSION_USER_PASSWORD: yummyai_ci_disposable_identity
      API_BASE_URL: http://127.0.0.1:8000
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create disposable CI environment
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { randomBytes } from 'node:crypto';
          const source = readFileSync('.env.example', 'utf8');
          const lines = source.split(/\r?\n/).map(line => {
            const match = /^([A-Z0-9_]+)=/.exec(line);
            if (!match) return line;
            const name = match[1];
            if (name.endsWith('_ENCRYPTION_KEY')) return `${name}=${randomBytes(32).toString('hex')}`;
            return process.env[name] === undefined ? line : `${name}=${JSON.stringify(process.env[name])}`;
          });
          writeFileSync('.env', lines.join('\n') + '\n', { flag: 'wx', mode: 0o600 });
          NODE
      - name: Check source before starting infrastructure
        run: pnpm check:secrets
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --concurrency=2
      - run: docker compose -f infra/docker-compose.yml -f infra/ci.compose.yml up -d --build postgres redis minio keycloak clamav otel-collector
      - name: Wait for infrastructure
        run: |
          for i in {1..150}; do
            unhealthy=$(docker compose -f infra/docker-compose.yml -f infra/ci.compose.yml ps --format json | jq -s '[.[] | select(.Health != "healthy" and .State != "exited")] | length')
            [ "$unhealthy" = "0" ] && exit 0
            sleep 2
          done
          docker compose -f infra/docker-compose.yml -f infra/ci.compose.yml ps
          exit 1
      - name: Start pinned creative canvas
        run: docker compose -f infra/infinite-canvas.compose.yml up -d --wait --wait-timeout 180
      - run: pnpm --filter @yummyai/database db:migrate
      - name: Bootstrap CI service identity
        working-directory: apps/api
        run: node --import tsx src/bootstrap-local.ts
      - run: pnpm --filter @yummyai/database exec drizzle-kit check
      - run: pnpm test:integration
      - name: Validate personal Studio model configuration integration
        run: pnpm test:e2e:order-daily --suite=studio-model-selection-integration
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --workers=1
      - run: pnpm build
      - run: pnpm --filter @yummyai/extension zip
      - run: pnpm release:manifest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            playwright-report
            test-results
            apps/*/playwright-report
            apps/*/test-results
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.sha }}
          path: |
            output/release-candidate/release-candidate-manifest.json
            apps/extension/.output/*.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - if: always()
        run: docker compose -f infra/docker-compose.yml -f infra/ci.compose.yml logs --tail=120
      - if: always()
        run: docker compose -f infra/infinite-canvas.compose.yml logs --tail=80
  windows-node-gates:
    name: Windows store node platform and file locks
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @yummyai/store-api-node exec vitest run --config vitest.config.ts src/local.windows.test.ts --reporter=verbose

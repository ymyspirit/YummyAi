name: YummyAI release gates

on:
  workflow_dispatch:
    inputs:
      gate:
        description: Checks to run
        type: choice
        options: [all, windows]
        default: all
  pull_request:
  push:
    # Branch updates are checked by pull_request.synchronize. Checking them
    # again on push creates duplicate runs that cancel one another.
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ inputs.gate || 'all' }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || inputs.gate == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      POSTGRES_DB: yummyai
      POSTGRES_USER: yummyai_local
      POSTGRES_PASSWORD: yummyai_ci_postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql://yummyai_local:yummyai_ci_postgres@localhost:5432/yummyai
      REDIS_PASSWORD: yummyai_ci_redis
      REDIS_PORT: 6379
      REDIS_URL: redis://:yummyai_ci_redis@localhost:6379
      MINIO_ROOT_USER: yummyai_ci_admin
      MINIO_ROOT_PASSWORD: yummyai_ci_minio_password
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: yummyai_ci_admin
      S3_SECRET_ACCESS_KEY: yummyai_ci_minio_password
      S3_PRIVATE_BUCKET: yummyai-private
      KEYCLOAK_ADMIN: yummyai_ci_admin
      KEYCLOAK_ADMIN_PASSWORD: yummyai_ci_keycloak
      OIDC_ISSUER: http://localhost:8081/realms/yummyai
      OIDC_AUDIENCE: yummyai-api
      OIDC_WEB_CLIENT_ID: yummyai-web
      OIDC_WEB_REDIRECT_URI: http://localhost:3000/auth/callback
      LOCAL_OIDC_CLIENT_ID: yummyai-local-web
      LOCAL_OIDC_CLIENT_SECRET: yummyai_ci_local_oidc_secret
      LOCAL_EXTENSION_USER: yummyai-local
      LOCAL_EXTENSION_USER_EMAIL: yummyai-extension@yummyai.local
      LOCAL_EXTENSION_USER_PASSWORD: yummyai_ci_disposable_identity
      API_BASE_URL: http://127.0.0.1:8000
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create disposable CI environment
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { randomBytes } from 'node:crypto';
          const source = readFileSync('.env.example', 'utf8');
          const lines = source.split(/\r?\n/).map(line => {
            const match = /^([A-Z0-9_]+)=/.exec(line);
            if (!match) return line;
            const name = match[1];
            if (name.endsWith('_ENCRYPTION_KEY')) return `${name}=${randomBytes(32).toString('base64url')}`;
            return process.env[name] === undefined ? line : `${name}=${JSON.stringify(process.env[name])}`;
          });
          writeFileSync('.env', lines.join('\n') + '\n', { flag: 'wx', mode: 0o600 });
          NODE
      - name: Check source before starting infrastructure
        run: pnpm check:secrets
      - run: pnpm lint
      - run: pnpm typecheck --concurrency=2
      - run: pnpm test --concurrency=2
      - name: Prepare pinned native ImageMagick
        shell: bash
        run: |
          set -euo pipefail
          native_dir="$RUNNER_TEMP/yummyai-imagemagick-7.1.2-34"
          mkdir "$native_dir"
          curl --fail --location --retry 2 --output "$native_dir/runtime.AppImage" \
            https://github.com/ImageMagick/ImageMagick/releases/download/7.1.2-34/ImageMagick-7.1.2-34-gcc-x86_64.AppImage
          printf '%s  %s\n' '6e9edfd35d5f30b57c27533afe003d6085faaf8607b207426f398d11751acf93' "$native_dir/runtime.AppImage" | sha256sum --check --status
          chmod +x "$native_dir/runtime.AppImage"
          (cd "$native_dir" && ./runtime.AppImage --appimage-extract > /dev/null)
          native_executable="$native_dir/squashfs-root/AppRun"
          native_version="$("$native_executable" -version)"
          [[ "$native_version" == *'ImageMagick 7.1.2-34'* ]]
          printf '%s\n' "$native_version"
          printf 'POD_MOCKUP_MAGICK_PATH=%s\n' "$native_executable" >> "$GITHUB_ENV"
          "$native_executable" -size 8x8 xc:red -alpha on "PNG32:$native_dir/source.png"
          "$native_executable" "$native_dir/source.png" -filter point -virtual-pixel transparent \
            -distort Perspective '0,0 0,0 7,0 7,0 0,7 0,7 7,7 7,7' "PNG32:$native_dir/perspective.png"
          POD_NATIVE_READINESS_OUTPUT="$native_dir/perspective.png" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createRequire } from 'node:module';
          import { resolve } from 'node:path';
          const sharp = createRequire(resolve('packages/mockup-renderer/package.json'))('sharp');
          const file = process.env.POD_NATIVE_READINESS_OUTPUT;
          const metadata = await sharp(file).metadata();
          assert.equal(metadata.width, 8); assert.equal(metadata.height, 8); assert.equal(metadata.hasAlpha, true);
          const { data, info } = await sharp(file).ensureAlpha().raw().toBuffer({ resolveWithObject: true });
          assert.equal(info.channels, 4); assert.equal(data.length, 256);
          for (let pixel = 0; pixel < 64; pixel++) assert.deepEqual([...data.subarray(pixel * 4, pixel * 4 + 4)], [255, 0, 0, 255]);
          console.log(JSON.stringify({ imageMagick: '7.1.2-34', nativePerspectivePixelsVerified: 64, alphaVerified: true }));
          NODE
      - run: docker compose -f infra/docker-compose.yml -f infra/ci.compose.yml up -d --build postgres redis minio keycloak clamav otel-collector
      - name: Wait for infrastructure
        run: |
          for i in {1..150}; do
            unhealthy=$(docker compose -f infra/docker-compose.yml -f infra/ci.compose.yml ps --format json | jq -s '[.[] | select(.Health != "healthy" and .State != "exited")] | length')
            [ "$unhealthy" = "0" ] && exit 0
            sleep 2
          done
          docker compose -f infra/docker-compose.yml -f infra/ci.compose.yml ps
          exit 1
      - name: Start pinned creative canvas
        run: docker compose -f infra/infinite-canvas.compose.yml up -d --wait --wait-timeout 180
      - run: pnpm --filter @yummyai/database db:migrate
      - name: Bootstrap CI service identity
        working-directory: apps/api
        run: node --import tsx src/bootstrap-local.ts
      - run: pnpm --filter @yummyai/database exec drizzle-kit check
      - run: pnpm exec playwright install --with-deps chromium
      - name: Install fixed P2 CI browser
        run: env -u CHROME_BIN node tools/scripts/install-p2-ci-browser.mjs
      - name: Validate original creative recovery on one compiled candidate
        run: env -u CHROME_BIN node --env-file=.env --import ./apps/api/node_modules/tsx/dist/loader.mjs tools/scripts/run-p2-creative-browser.mjs
      - name: Validate product knowledge and personal Agent on the same candidate
        run: node --env-file=.env --import ./apps/api/node_modules/tsx/dist/loader.mjs tools/scripts/run-p6-knowledge-agent-browser.mjs
      - name: Validate current knowledge evaluation and versioned Agent owners
        shell: bash
        run: |
          set -euo pipefail
          # MCP-v2 end-to-end uses the installed Windows Codex host and CurrentUser
          # DPAPI. Its release evidence is recorded on that host; the existing
          # Windows job separately verifies the actual credential implementation.
          for suite in knowledge-evaluation-execution-integration knowledge-benchmark-integration business-benchmark-integration role-benchmark-integration agent-tools-integration agent-native-v4-integration agent-native-v4-late-integration agent-delegation-integration; do
            pnpm test:e2e:order-daily --suite="$suite"
          done
      - run: pnpm test:integration
      - name: Validate personal Studio model configuration integration
        run: pnpm test:e2e:order-daily --suite=studio-model-selection-integration
      - name: Validate creative original adoption and explicit image quotations
        shell: bash
        run: |
          set -euo pipefail
          for suite in creative-response-adoption-integration studio-paid-image-integration creative-owner-response-adoption-integration studio-visual-paid-image-integration studio-paid-image-legacy-regression; do
            pnpm test:e2e:order-daily --suite="$suite" --cache=false
          done
      - name: Validate order to factory status intake
        run: pnpm test:e2e:order-daily --suite=factory-erp-import-integration
      - run: pnpm test:e2e --workers=1
      - name: Validate production specification purpose and rule adoption
        run: pnpm test:e2e:order-daily --suite=specification-facts --grep=production-purpose
      - name: Validate pinned pillow size basis in the personal editor
        run: pnpm test:e2e:order-daily --suite=catalog-editor --grep="pillow size basis"
      - run: pnpm build --concurrency=2
      - run: pnpm --filter @yummyai/extension zip
      - run: pnpm release:manifest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            playwright-report
            test-results
            apps/*/playwright-report
            apps/*/test-results
            output/p2-creative-browser
            output/p6-knowledge-agent-browser
            tmp/order-daily-artifacts-*/acceptance-manifest.json
            tmp/order-daily-artifacts-*/browser/**/*proof.json
            tmp/order-daily-artifacts-*/playwright/**/*proof.json
            tmp/order-daily-artifacts-*/playwright/**/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.sha }}
          path: |
            output/release-candidate/release-candidate-manifest.json
            apps/extension/.output/*.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - if: always()
        run: docker compose -f infra/docker-compose.yml -f infra/ci.compose.yml logs --tail=120
      - if: always()
        run: docker compose -f infra/infinite-canvas.compose.yml logs --tail=80
  windows-node-gates:
    name: Windows store node platform and file locks
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate actual Windows DPAPI credential storage
        run: pnpm --filter @yummyai/agent-mcp exec vitest run src/agent-mcp-auth.test.ts --maxWorkers=1 --minWorkers=1 --reporter=verbose
      - run: pnpm --filter @yummyai/store-api-node exec vitest run --config vitest.config.ts src/local.windows.test.ts --reporter=verbose

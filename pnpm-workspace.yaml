packages:
  - "apps/*"
  - "packages/*"

# Root-level acceptance tools import these workspace packages directly.
# Keep their resolution inside each checkout, including an adopted snapshot.
nodeLinker: isolated
enableGlobalVirtualStore: false
publicHoistPattern:
  - "@yummyai/*"
verifyDepsBeforeRun: error

overrides:
  "@vitejs/plugin-react": "5.2.0"

allowBuilds:
  canvas: false
  esbuild: true
  msgpackr-extract: false
  sharp: true
  spawn-sync: false

minimumReleaseAgeExclude:
  - lucide-react@1.25.0

patchedDependencies:
  postgres@3.4.9: patches/postgres@3.4.9.patch
